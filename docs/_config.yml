title: FTCC SkillsUSA Prep
description: Independent preparation site for FTCC SkillsUSA teams, 2026–27. Web Design and Development, and Computer Programming.
url: https://norrisaftcc.github.io
# The repo name. Change this if the repo is renamed.
baseurl: /project-skillsusa
lang: en

